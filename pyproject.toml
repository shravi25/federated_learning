[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persistent-fl"
version = "1.0.0"
description = "Federated Learning research project with persistent checkpoints on Forest Cover Type dataset"
license = { file = "LICENSE" }
dependencies = [
    "flwr[simulation]>=1.42.0",
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["federated_app"]

[tool.flwr.app]
publisher = "researcher"
fab-format-version = 1
flwr-version-target = "1.42.0"

[tool.flwr.app.components]
serverapp = "federated_app.server_app:app"
clientapp = "federated_app.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 50
num-clients = 5
fraction-evaluate = 1.0
local-epochs = 7
learning-rate = 0.0005
batch-size = 128
auto-resume = false
checkpoint-dir = "checkpoints"
results-dir = "results"
seed = 42
